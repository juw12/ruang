[package]
name = "ruang"
version = "1.2.0"
description = "Ruang: photograph your room, plan it like an architect"
authors = ["Juwen Lie"]
license = "MIT"
edition = "2021"

[lib]
name = "ruang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruang"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
