name: Apps (Windows + Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build ruang.exe + NSIS installer (Tauri 2, web app embedded)
        run: |
          python desktop/build.py --copy-only
          cd desktop
          npx --yes @tauri-apps/cli@^2 build --bundles nsis

      - name: Make sure the WebView2 runtime is present
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-setup.exe
            Start-Process -FilePath .\webview2-setup.exe -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          }
          "WebView2 runtime: $version"

      - name: Smoke-test the native window (WebView2 over CDP)
        run: |
          python -m pip install --quiet websocket-client
          python tests/desktop_smoke.py

      - name: Smoke-test the installer (silent install, files + uninstaller present, silent uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "installer: $($setup.Name) $($setup.Length) bytes"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Ruang'
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $dir 'ruang.exe'))) { throw "ruang.exe not installed in $dir" }
          if (-not (Test-Path (Join-Path $dir 'uninstall.exe'))) { throw "uninstall.exe missing in $dir" }
          $shortcut = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Ruang*.lnk' | Select-Object -First 1
          if (-not $shortcut) { throw "no Start-menu shortcut" }
          "start menu: $($shortcut.FullName)"
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'ruang.exe')) { throw "uninstall left ruang.exe behind" }
          "install + uninstall ok"

      - name: Name the release files
        shell: pwsh
        run: |
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item desktop/target/release/ruang.exe "out/Ruang-$version-windows-x64.exe"
          $setup = Get-ChildItem desktop/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/Ruang-$version-windows-x64-setup.exe"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruang-windows
          path: |
            out/
            hone/shots/12-desktop-*.png
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Android APK (Tauri 2 mobile, arm64 + armv7 + x86_64)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          python3 desktop/build.py --copy-only
          cd desktop
          npx --yes @tauri-apps/cli@^2 android init --ci
          npx --yes @tauri-apps/cli@^2 icon icons/icon.png
          npx --yes @tauri-apps/cli@^2 android build --apk --target aarch64 armv7 x86_64
          find gen/android -name "*.apk" -printf "%p %s bytes\n"

      - name: Sign the APK (stable release key from repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          unsigned=$(find desktop/gen/android -path "*universal/release*" -name "*.apk" | head -1)
          [ -n "$unsigned" ] || { echo "no universal release APK found"; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $tools"
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ruang.p12"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/ruang.p12" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "out/Ruang-$version-android.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/ruang.p12"
          "$tools/apksigner" verify --verbose --print-certs "out/Ruang-$version-android.apk" | tee out/apk-signature.txt
          "$tools/aapt2" dump badging "out/Ruang-$version-android.apk" | head -5 | tee out/apk-badging.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ruang-android
          path: out/

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ruang-android
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot the APK on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android_smoke.sh apk hone/shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruang-android-smoke
          path: hone/shots/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, android-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ruang-windows
          path: dl/windows

      - uses: actions/download-artifact@v4
        with:
          name: ruang-android
          path: dl/android

      - name: Collect files + checksums
        run: |
          mkdir -p out
          cp dl/windows/out/*.exe out/
          cp dl/android/*.apk out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.apk
            out/SHA256SUMS.txt
