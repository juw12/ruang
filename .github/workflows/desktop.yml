name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ruang.exe (Tauri 2, web app embedded)
        run: python desktop/build.py

      - name: Make sure the WebView2 runtime is present
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-setup.exe
            Start-Process -FilePath .\webview2-setup.exe -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          }
          "WebView2 runtime: $version"

      - name: Smoke-test the native window (WebView2 + Playwright over CDP)
        run: |
          python -m pip install --quiet playwright pillow
          python tests/desktop_smoke.py

      - name: Name the release file
        shell: pwsh
        run: |
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item desktop/target/release/ruang.exe "out/Ruang-$version-windows-x64.exe"
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruang-windows
          path: |
            out/
            hone/shots/12-desktop-*.png
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/SHA256SUMS.txt
