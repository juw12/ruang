<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ruang - room photo to 3D planner</title>
  <meta name="description" content="Turn room photos into a 3D model, restyle it (realistic, miniature, pixel, cartoon, clay, blueprint, sketch), rearrange furniture, try renovations from 18 country styles and see the cost in your currency. Free, private, runs in your browser.">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ruang">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="Ruang home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26V10l12-6 12 6v16" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 26h24M11 26V16h10v10" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
      <span class="word">Ruang</span>
    </a>
    <span class="tag" data-t="app.tag"></span>
    <div class="bar-actions">
      <button class="btn ghost" id="btnNew" data-t="common.new"></button>
      <button class="btn ghost" id="btnRegion" aria-haspopup="dialog"></button>
    </div>
  </header>

  <main class="work">
    <nav class="steps" aria-label="Steps"></nav>
    <section class="stage" aria-label="Viewport">
      <div id="view" class="view"></div>
      <div id="photoEd" class="photo-ed" hidden>
        <canvas id="photoCanvas"></canvas>
        <div id="pickPop" class="pick-pop" hidden></div>
      </div>
      <div class="viewbar" id="viewbar"></div>
      <div class="split-handle" id="splitHandle" hidden><span></span></div>
      <div class="walkpad" id="walkpad" hidden>
        <button class="btn" id="walkFwd" data-t="walk.fwd"></button>
        <small data-t="walk.hint"></small>
      </div>
      <div class="sunbar" id="sunbar"></div>
      <div class="titleblock" id="titleblock"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <dialog id="onboard" class="dlg">
    <form method="dialog" id="onboardForm">
      <h2 data-t="onb.title"></h2>
      <label><span data-t="onb.region"></span><select id="selRegion"></select></label>
      <label><span data-t="onb.lang"></span><select id="selLang"></select></label>
      <p class="muted" data-t="onb.note"></p>
      <button class="btn primary" value="ok" data-t="onb.go"></button>
    </form>
  </dialog>

  <input type="file" id="filePhotos" accept="image/*" multiple hidden>
  <input type="file" id="fileRef" accept="image/*" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
